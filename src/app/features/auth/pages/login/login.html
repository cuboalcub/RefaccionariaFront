<div class = "login-container">

    <!-- Mitad izquierda/formulario-->

    <div class="login-left">

        <img [src]="logoPath" alt="Logo refaccionaria" class="logo"/>

        <h2 class="login-title">Login</h2>
        <p class="login-description">
            Para ingresar necesita el usuario y la contraseña que el administrador
            o el empleador le ha proporcionado
        </p>

        <label for="username" class="input-label">Usuario</label>
        <input type="text" id="username" placeholder="Ingresa tu usuario" class="input-field"/>

        <label for="password" class="input-label">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" class="input-field"/>

        <button class="button-login">Ingresar</button>
    </div>

    <!-- Mitad derecha/imágen-->

    <div class="login-right">
        <img src="assets/refaccionaria.jpg" alt="login-img" class="login-img" />
    </div>
</div>
